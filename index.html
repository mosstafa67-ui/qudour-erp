<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#162033">
<title>غذائيات القدور ERP POS</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#182033;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0;background:#f4f6f8}button,input,select,textarea{font:inherit}
button{cursor:pointer}.hide{display:none!important}.shell{max-width:1240px;margin:auto;padding:12px}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #dfe3e8}.topin{max-width:1240px;margin:auto;padding:9px 12px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{font-weight:900;font-size:20px}.muted{color:#6f7784;font-size:12px}.online{color:#176b2c}.offline{color:#9d2424}
.card{background:#fff;border:1px solid #e1e5ea;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 12px #00000008}
.login{max-width:430px;margin:8vh auto}.login h1{margin:0 0 4px;font-size:28px}
label{display:block;font-size:13px;margin:7px 0 4px;color:#4d5664}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cbd2dc;border-radius:9px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#58677d;box-shadow:0 0 0 2px #58677d18}
textarea{min-height:72px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}
.btn{border:1px solid #c9d0d9;background:#fff;border-radius:9px;padding:9px 13px}.primary{background:#182033;color:#fff;border-color:#182033}.danger{background:#962f2f;color:#fff;border-color:#962f2f}.okbtn{background:#176b2c;color:#fff;border-color:#176b2c}
.btn:disabled{opacity:.55;cursor:wait}.nav{display:flex;gap:6px;overflow:auto;padding:8px 0;scrollbar-width:thin}.nav .btn{white-space:nowrap}.nav .active{background:#182033;color:#fff}
.section{font-size:18px;font-weight:850;margin-bottom:9px}.kpi{font-size:25px;font-weight:900}.pill{display:inline-block;border-radius:999px;padding:3px 8px;border:1px solid #d6dbe2;font-size:12px}
.warn{background:#fff6dd;border-color:#ead08c}.bad{background:#fdecec;border-color:#efbbbb}.good{background:#eaf7ed;border-color:#b7dbbd}
.tablewrap{overflow:auto;max-height:65vh}.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{padding:8px;border-bottom:1px solid #edf0f2;text-align:right;vertical-align:middle}.tbl th{position:sticky;top:0;background:#fafbfc;z-index:2}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}.product-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:46vh;overflow:auto}
.product{border:1px solid #dfe4ea;border-radius:11px;padding:10px;background:#fff;cursor:pointer}.product:hover{border-color:#8793a3}.product .name{font-weight:750}.product .price{font-size:18px;font-weight:900;margin-top:5px}
.line{display:grid;grid-template-columns:minmax(180px,2fr) 95px 120px 110px auto;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid #eee}
.cart-total{font-size:28px;font-weight:950;text-align:left;padding:10px 0}.msg{margin-top:10px;white-space:pre-wrap}.error{color:#9d2424}.success{color:#176b2c}
.toast{position:fixed;left:14px;bottom:14px;z-index:100;background:#182033;color:white;padding:11px 14px;border-radius:10px;display:none;max-width:420px}
.quickbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.quickbar input{font-size:17px}
.sticky-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px;margin:0 -14px -14px;z-index:8;border-radius:0 0 14px 14px}
.small{font-size:12px}.right{text-align:right}.left{text-align:left}
@media(max-width:700px){
 .shell{padding:8px}.card{padding:11px;border-radius:12px}.topin{padding:8px}
 .line{grid-template-columns:1fr 80px 100px}.line .line-name{grid-column:1/-1}.line .line-total{display:none}
 .product-list{grid-template-columns:repeat(2,minmax(0,1fr));max-height:42vh}
 .product{padding:8px}.product .price{font-size:16px}
 .cart-total{font-size:23px}.nav{padding-bottom:6px}
}
</style>
</head>
<body>
<section id="authView" class="shell">
 <div class="card login">
  <h1>غذائيات القدور</h1>
  <div class="muted">ERP / POS — دخول الموظفين المصرح لهم فقط</div>
  <label>البريد الإلكتروني</label><input id="authEmail" type="email" autocomplete="email">
  <label>كلمة المرور</label><input id="authPassword" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:12px">
   <button id="loginBtn" class="btn primary grow" type="button">دخول</button>
   <button id="signupBtn" class="btn grow" type="button">تفعيل حساب موظف</button>
  </div>
  <div class="muted" style="margin-top:8px">الحساب الجديد لا يحصل على صلاحيات إلا إذا كان بريده مسجلًا مسبقًا كموظف.</div>
  <div id="authMsg" class="msg muted"></div>
 </div>
</section>

<section id="appView" class="hide">
 <header class="top"><div class="topin">
  <div><div class="brand">غذائيات القدور ERP</div><div id="who" class="muted"></div></div>
  <div class="row"><span id="net" class="pill"></span><span id="shiftBadge" class="pill"></span><button id="logoutBtn" class="btn" type="button">خروج</button></div>
 </div></header>
 <div class="shell"><div id="nav" class="nav"></div><main id="main"></main></div>
</section>
<div id="toast" class="toast"></div>

<script>
"use strict";
const BASE="https://sirlzuuqnygrxxvipygx.supabase.co";
const KEY="sb_publishable_dvgfbh2SiWdg76EN5BawEw_scEcawBX";
const SESSION_KEY="qudour_erp_session_v3";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>Number(v??0).toLocaleString("ar-EG",{maximumFractionDigits:2});
const qty=v=>Number(v??0).toLocaleString("ar-EG",{maximumFractionDigits:3});
const today=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Damascus"});
const rid=prefix=>prefix+"-"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2));
const S={profile:null,employeeId:null,products:[],parties:[],accounts:[],stores:[],registers:[],categories:[],shift:null,saleCart:[],purchaseCart:[],stock:new Map(),page:"dashboard"};

function toast(m,bad=false){const t=$("toast");t.textContent=m;t.style.background=bad?"#962f2f":"#182033";t.style.display="block";setTimeout(()=>t.style.display="none",4200)}
function parseErr(j,status){if(j&&typeof j==="object")return j.message||j.msg||j.error_description||j.error||("HTTP "+status);return String(j||("HTTP "+status))}
function readSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch{return null}}
function writeSession(s){if(s)localStorage.setItem(SESSION_KEY,JSON.stringify(s));else localStorage.removeItem(SESSION_KEY)}
async function refreshSession(){
 const s=readSession();if(!s?.refresh_token)return null;
 try{
  const r=await fetch(BASE+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"content-type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});
  const j=await r.json().catch(()=>({}));if(!r.ok||!j.access_token){writeSession(null);return null}writeSession(j);return j;
 }catch{writeSession(null);return null}
}
async function api(path,{method="GET",body=null,headers={},auth=true,retry=true}={}){
 let s=readSession();if(auth&&s?.expires_at&&Date.now()/1000>Number(s.expires_at)-60)s=await refreshSession();
 const h={apikey:KEY,...headers};if(auth&&s?.access_token)h.authorization="Bearer "+s.access_token;
 let r;try{r=await fetch(BASE+path,{method,headers:h,body:body===null?null:JSON.stringify(body)})}catch(e){throw new Error("تعذر الاتصال بالخادم. تحقق من الإنترنت ثم أعد المحاولة؛ الطلبات المحمية لن تتكرر إذا استخدمت زر إعادة المحاولة.")}
 if(r.status===401&&retry&&auth&&readSession()?.refresh_token){const n=await refreshSession();if(n)return api(path,{method,body,headers,auth,retry:false})}
 const txt=await r.text();let data=null;if(txt){try{data=JSON.parse(txt)}catch{data=txt}}if(!r.ok)throw new Error(parseErr(data,r.status));return data;
}
async function rpc(name,args={}){return api("/rest/v1/rpc/"+encodeURIComponent(name),{method:"POST",headers:{"content-type":"application/json"},body:args})}
async function select(table,{columns="*",filters=[],order=null,limit=null}={}){
 const u=new URL(BASE+"/rest/v1/"+encodeURIComponent(table));u.searchParams.set("select",columns);
 for(const [c,op,v] of filters)u.searchParams.append(c,op+"."+String(v));if(order)u.searchParams.set("order",order);if(limit!==null)u.searchParams.set("limit",String(limit));
 return api(u.pathname+u.search);
}
async function signIn(email,password){
 const r=await fetch(BASE+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"content-type":"application/json"},body:JSON.stringify({email,password})});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(parseErr(j,r.status));writeSession(j);return j;
}
async function signUp(email,password){
 const r=await fetch(BASE+"/auth/v1/signup",{method:"POST",headers:{apikey:KEY,"content-type":"application/json"},body:JSON.stringify({email,password})});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(parseErr(j,r.status));if(j.access_token)writeSession(j);return j;
}
async function signOut(){const s=readSession();if(s?.access_token){try{await fetch(BASE+"/auth/v1/logout",{method:"POST",headers:{apikey:KEY,authorization:"Bearer "+s.access_token}})}catch{}}writeSession(null)}
function has(k){return !!S.profile?.permissions?.admin||!!S.profile?.permissions?.[k]||["owner","admin"].includes(S.profile?.role)}
function updateNet(){const n=$("net");if(!n)return;n.textContent=navigator.onLine?"متصل":"بدون اتصال";n.className="pill "+(navigator.onLine?"online":"offline")}
addEventListener("online",updateNet);addEventListener("offline",updateNet);
function updateShiftBadge(){const b=$("shiftBadge");if(!b)return;b.textContent=S.shift?"وردية مفتوحة":"لا توجد وردية";b.className="pill "+(S.shift?"online":"offline")}
async function lockBtn(btn,fn){if(btn.disabled)return;const old=btn.textContent;btn.disabled=true;btn.textContent="جارٍ التنفيذ...";try{return await fn()}finally{btn.disabled=false;btn.textContent=old}}
function pendingId(key,prefix){let x=sessionStorage.getItem(key);if(!x){x=rid(prefix);sessionStorage.setItem(key,x)}return x}
function clearPending(key){sessionStorage.removeItem(key)}

$("loginBtn").onclick=()=>lockBtn($("loginBtn"),async()=>{
 const email=$("authEmail").value.trim(),password=$("authPassword").value;$("authMsg").textContent="جارٍ التحقق...";$("authMsg").className="msg muted";
 try{if(!email||!password)throw new Error("أدخل البريد وكلمة المرور.");await signIn(email,password);await startApp()}
 catch(e){$("authMsg").textContent=e.message;$("authMsg").className="msg error"}
});
$("signupBtn").onclick=()=>lockBtn($("signupBtn"),async()=>{
 const email=$("authEmail").value.trim(),password=$("authPassword").value;$("authMsg").textContent="جارٍ تفعيل الحساب...";$("authMsg").className="msg muted";
 try{if(!email||password.length<8)throw new Error("استخدم كلمة مرور من 8 أحرف على الأقل.");const j=await signUp(email,password);if(j.access_token)await startApp();else{$("authMsg").textContent="تم إنشاء الحساب. أكد البريد الإلكتروني إن وصلت رسالة ثم سجّل الدخول.";$("authMsg").className="msg success"}}
 catch(e){$("authMsg").textContent=e.message;$("authMsg").className="msg error"}
});
$("logoutBtn").onclick=async()=>{await signOut();location.reload()};

async function claimProfile(){
 try{await rpc("claim_employee_account",{})}catch{}
 const p=await rpc("my_profile",{});if(!Array.isArray(p)||!p.length)throw new Error("الحساب غير مربوط بموظف فعال في النظام.");return p[0];
}
async function loadBase(){
 S.employeeId=await rpc("current_employee_id",{}).catch(()=>null);
 const tasks=[
  select("v_product_current_prices",{filters:[["status","eq","active"]],order:"name.asc"}),
  select("parties",{columns:"id,party_code,name,is_customer,is_supplier,status",filters:[["status","eq","active"]],order:"name.asc"}),
  select("financial_accounts",{columns:"id,account_code,name,currency,account_type,is_active",filters:[["is_active","eq","true"]],order:"account_code.asc"}),
  select("stores",{columns:"id,code,name,is_active",filters:[["is_active","eq","true"]]}),
  select("pos_registers",{columns:"id,store_id,code,name,is_active",filters:[["is_active","eq","true"]]}).catch(()=>[]),
  select("expense_categories",{columns:"id,code,name,status",filters:[["status","eq","active"]],order:"sort_order.asc"}).catch(()=>[]),
  select("v_stock_balance",{columns:"store_id,product_id,quantity,avg_cost_base,inventory_value_base"}).catch(()=>[])
 ];
 const [p,pa,a,st,r,c,stock]=await Promise.all(tasks);S.products=p||[];S.parties=pa||[];S.accounts=a||[];S.stores=st||[];S.registers=r||[];S.categories=c||[];
 S.stock=new Map((stock||[]).map(x=>[(x.store_id||"")+"|"+x.product_id,x]));
 await refreshShift();
}
async function refreshShift(){
 if(!S.employeeId){S.shift=null;updateShiftBadge();return}
 const rows=await select("pos_shifts",{columns:"id,register_id,employee_id,opened_at,status,notes",filters:[["employee_id","eq",S.employeeId],["status","eq","open"]],order:"opened_at.desc",limit:1}).catch(()=>[]);
 S.shift=rows?.[0]||null;updateShiftBadge();
}
function nav(){
 const items=S.profile?.role==="price_worker"?[["prices","الأسعار"]]:[
 ["dashboard","الرئيسية"],["shift","الوردية"],["sale","بيع سريع"],["purchase","شراء"],["expense","مصروف"],["payment","قبض/دفع"],["inventory","المخزون والجرد"],["prices","الأسعار"],["debts","الذمم"],["payroll","الموظفون والرواتب"],["search","بحث"],["reports","التقارير"]];
 $("nav").innerHTML=items.map(([k,l])=>`<button class="btn" data-p="${k}" type="button">${l}</button>`).join("");
 $("nav").onclick=e=>{const b=e.target.closest("[data-p]");if(b)go(b.dataset.p)};
}
async function startApp(){
 try{
  if(!readSession()?.access_token)throw new Error("سجّل الدخول أولًا.");
  S.profile=await claimProfile();if(S.profile.role!=="price_worker")await loadBase();
  $("who").textContent=(S.profile.name||"")+" — "+(S.profile.role||"");$("authView").classList.add("hide");$("appView").classList.remove("hide");nav();updateNet();updateShiftBadge();
  await go(S.profile.role==="price_worker"?"prices":"dashboard");
 }catch(e){await signOut();$("appView").classList.add("hide");$("authView").classList.remove("hide");$("authMsg").className="msg error";$("authMsg").textContent=e.message}
}
async function go(p){
 S.page=p;document.querySelectorAll("#nav [data-p]").forEach(b=>b.classList.toggle("active",b.dataset.p===p));$("main").innerHTML='<div class="card">جارٍ التحميل...</div>';
 try{
  if(p==="dashboard")await renderDashboard();else if(p==="shift")await renderShift();else if(p==="sale")await renderSale();else if(p==="purchase")await renderPurchase();
  else if(p==="expense")await renderExpense();else if(p==="payment")await renderPayment();else if(p==="inventory")await renderInventory();else if(p==="prices")await renderPrices();
  else if(p==="debts")await renderDebts();else if(p==="payroll")await renderPayroll();else if(p==="search")renderSearch();else if(p==="reports")await renderReports();
 }catch(e){$("main").innerHTML=`<div class="card bad"><b>تعذر تحميل القسم</b><div class="msg error">${esc(e.message)}</div></div>`}
}

async function renderDashboard(){
 const [alerts,shifts,expenses]=await Promise.all([
  select("v_operational_alerts",{limit:25}).catch(()=>[]),
  select("v_pos_shift_summary",{order:"opened_at.desc",limit:5}).catch(()=>[]),
  select("v_expense_summary_monthly",{order:"month.desc",limit:12}).catch(()=>[])
 ]);
 $("main").innerHTML=`<div class="grid">
 <div class="card"><div class="muted">الأصناف</div><div class="kpi">${S.products.length}</div></div>
 <div class="card"><div class="muted">الأطراف</div><div class="kpi">${S.parties.length}</div></div>
 <div class="card ${S.shift?"good":"warn"}"><div class="muted">الوردية</div><div class="kpi">${S.shift?"مفتوحة":"مغلقة"}</div></div>
 <div class="card"><div class="muted">تنبيهات</div><div class="kpi">${alerts.length}</div></div></div>
 <div class="grid"><div class="card"><div class="section">آخر الورديات</div>${shifts.map(x=>`<div style="padding:6px 0;border-bottom:1px solid #eee">${esc(x.register_code||"")} — ${esc(x.employee_name||"")} — <span class="pill">${esc(x.status)}</span></div>`).join("")||'<div class="muted">لا توجد ورديات بعد.</div>'}</div>
 <div class="card"><div class="section">المصاريف الشهرية</div>${expenses.slice(0,8).map(x=>`<div style="display:flex;justify-content:space-between;padding:5px 0"><span>${esc(x.category_name||"")}</span><b>${money(x.total_amount)} ${esc(x.currency)}</b></div>`).join("")||'<div class="muted">لا توجد مصاريف بعد.</div>'}</div></div>
 <div class="card"><div class="section">التنبيهات التشغيلية</div>${alerts.map(x=>`<div style="padding:6px 0;border-bottom:1px solid #eee">${esc(x.message||"")}</div>`).join("")||'<div class="muted">لا توجد تنبيهات.</div>'}</div>`;
}

async function renderShift(){
 if(!has("sales")&&!has("closing"))throw new Error("لا توجد صلاحية للوردية.");
 await refreshShift();
 if(!S.shift){
  $("main").innerHTML=`<div class="card good"><div class="section">فتح وردية POS</div><div class="grid">
   <select id="reg">${S.registers.map(r=>`<option value="${r.id}">${esc(r.code+" — "+r.name)}</option>`).join("")}</select>
   <input id="openSyp" type="number" min="0" step="any" placeholder="افتتاح SYP" value="0">
   <input id="openUsd" type="number" min="0" step="any" placeholder="افتتاح USD" value="0">
  </div><textarea id="shiftNotes" placeholder="ملاحظات الوردية"></textarea><button id="openShift" class="btn primary" style="margin-top:9px" type="button">فتح الوردية</button></div>`;
  $("openShift").onclick=()=>lockBtn($("openShift"),async()=>{try{
   const req=pendingId("open_shift_req","SHIFT");
   await rpc("open_pos_shift",{p_register_id:$("reg").value,p_opening:{SYP:Number($("openSyp").value||0),USD:Number($("openUsd").value||0)},p_client_request_id:req,p_notes:$("shiftNotes").value||null});
   clearPending("open_shift_req");await refreshShift();toast("تم فتح الوردية");await renderShift();
  }catch(e){toast(e.message,true)}});return;
 }
 const cash=await select("pos_shift_cash",{columns:"currency,opening_amount,expected_close_amount,counted_close_amount,variance",filters:[["shift_id","eq",S.shift.id]]}).catch(()=>[]);
 $("main").innerHTML=`<div class="card good"><div class="section">الوردية الحالية مفتوحة</div><div class="grid">
  <div><div class="muted">وقت الفتح</div><b>${esc(new Date(S.shift.opened_at).toLocaleString("ar-EG"))}</b></div>
  ${cash.map(c=>`<div><div class="muted">افتتاح ${esc(c.currency)}</div><b>${money(c.opening_amount)}</b></div>`).join("")}</div></div>
 <div class="card"><div class="section">إغلاق الوردية</div><div class="grid"><input id="closeSyp" type="number" min="0" step="any" placeholder="المبلغ المعدود SYP"><input id="closeUsd" type="number" min="0" step="any" placeholder="المبلغ المعدود USD"></div>
 <textarea id="closeNotes" placeholder="ملاحظات الإغلاق"></textarea><button id="closeShift" class="btn danger" style="margin-top:9px" type="button">إغلاق الوردية</button></div>`;
 $("closeShift").onclick=()=>lockBtn($("closeShift"),async()=>{if(!confirm("سيتم إغلاق الوردية وتثبيت العد. متابعة؟"))return;try{
  const counted={};if($("closeSyp").value!=="")counted.SYP=Number($("closeSyp").value);if($("closeUsd").value!=="")counted.USD=Number($("closeUsd").value);
  await rpc("close_pos_shift",{p_shift_id:S.shift.id,p_counted:counted,p_notes:$("closeNotes").value||null});await refreshShift();toast("تم إغلاق الوردية");await renderShift();
 }catch(e){toast(e.message,true)}})
}

function partyOpts(kind,allowBlank=false){
 const list=S.parties.filter(p=>kind==="customer"?p.is_customer:p.is_supplier);return (allowBlank?'<option value="">عميل نقدي افتراضي</option>':"")+list.map(p=>`<option value="${p.id}">${esc(p.party_code+" — "+p.name)}</option>`).join("");
}
function accountOpts(cur="SYP"){return '<option value="">اختيار تلقائي للصندوق</option>'+S.accounts.filter(a=>!cur||a.currency===cur).map(a=>`<option value="${a.id}">${esc(a.name+" — "+a.currency)}</option>`).join("")}
function stockFor(productId,storeId=null){const sid=storeId||S.stores[0]?.id||"";return S.stock.get(sid+"|"+productId)||{quantity:0,avg_cost_base:0}}
function searchProducts(q){
 q=String(q||"").trim().toLowerCase();if(!q)return S.products.slice(0,60);
 return S.products.filter(p=>[p.product_code,p.name,p.barcode].some(v=>String(v||"").toLowerCase().includes(q))).slice(0,80);
}
function productCards(qv,clickId){
 return `<div class="product-list">${searchProducts(qv).map(p=>{const st=stockFor(p.product_id);return `<div class="product" data-add="${p.product_id}">
 <div class="small muted">${esc(p.product_code)} ${p.barcode?(" • "+esc(p.barcode)):""}</div><div class="name">${esc(p.name)}</div><div class="price">${money(p.sale_price)} ${esc(p.sale_currency||"")}</div><div class="small">مخزون: ${qty(st.quantity)}</div></div>`}).join("")}</div>`;
}
function cartHtml(cart){
 if(!cart.length)return '<div class="muted">السلة فارغة.</div>';
 return cart.map((x,i)=>`<div class="line"><div class="line-name"><b>${esc(x.name)}</b><div class="small muted">${esc(x.code)}</div></div>
 <input data-q="${i}" type="number" step="any" min="0.001" value="${x.quantity}">
 <input data-p="${i}" type="number" step="any" min="0" value="${x.unit_price}">
 <div class="line-total money">${money(x.quantity*x.unit_price)}</div><button class="btn" data-del="${i}" type="button">حذف</button></div>`).join("");
}
function bindCart(cart,refresh){
 $("cart").querySelectorAll("[data-q]").forEach(el=>el.onchange=()=>{cart[+el.dataset.q].quantity=Math.max(.001,Number(el.value)||.001);refresh()});
 $("cart").querySelectorAll("[data-p]").forEach(el=>el.onchange=()=>{cart[+el.dataset.p].unit_price=Math.max(0,Number(el.value)||0);refresh()});
 $("cart").querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>{cart.splice(+el.dataset.del,1);refresh()});
}

 <div class="card"><div class="section">توليد مسير راتب</div><select id="payEmp">${emps.map(e=>`<option value="${e.id}">${esc(e.employee_code+" — "+e.name)}</option>`).join("")}</select><div class="grid"><input id="perStart" type="date"><input id="perEnd" type="date"><input id="bonus" type="number" min="0" value="0" placeholder="مكافأة"><input id="deduct" type="number" min="0" value="0" placeholder="حسم"><input id="advance" type="number" min="0" value="0" placeholder="سلفة"></div><button id="genPayroll" class="btn primary" style="margin-top:8px" type="button">توليد المسير</button></div></div>
 <div class="card"><div class="section">المسيرات</div><div class="tablewrap"><table class="tbl"><thead><tr><th>الموظف</th><th>الفترة</th><th>الصافي</th><th>الحالة</th><th></th></tr></thead><tbody>${pay.map(x=>`<tr><td>${esc(em.get(x.employee_id)?.name||"")}</td><td>${esc(x.period_start+" → "+x.period_end)}</td><td>${money(x.net_amount)} ${esc(x.currency)}</td><td>${esc(x.status)}</td><td>${x.status!=="paid"?`<button class="btn" data-payroll="${x.id}">دفع</button>`:""}</td></tr>`).join("")}</tbody></table></div></div>`;
 $("saveSal").onclick=()=>lockBtn($("saveSal"),async()=>{try{const a=Number($("salAmt").value);if(!(a>=0))throw new Error("أدخل راتبًا صحيحًا.");await rpc("set_employee_compensation",{p_employee_id:$("salEmp").value,p_effective_from:$("salFrom").value,p_monthly_salary:a,p_currency:$("salCur").value,p_notes:null});toast("تم حفظ إعداد الراتب");await renderPayroll()}catch(e){toast(e.message,true)}})
 $("genPayroll").onclick=()=>lockBtn($("genPayroll"),async()=>{try{if(!$("perStart").value||!$("perEnd").value)throw new Error("حدد فترة الراتب.");await rpc("generate_employee_payroll",{p_employee_id:$("payEmp").value,p_period_start:$("perStart").value,p_period_end:$("perEnd").value,p_bonus:Number($("bonus").value||0),p_deduction:Number($("deduct").value||0),p_advance:Number($("advance").value||0),p_notes:null});toast("تم توليد المسير");await renderPayroll()}catch(e){toast(e.message,true)}})
 document.querySelectorAll("[data-payroll]").forEach(b=>b.onclick=()=>lockBtn(b,async()=>{try{const pr=pay.find(x=>x.id===b.dataset.payroll),acct=S.accounts.find(a=>a.currency===pr.currency&&a.account_type==="cash");if(!acct)throw new Error("لا يوجد صندوق فعال بعملة الراتب.");if(!confirm("دفع الراتب وتسجيله كمصروف؟"))return;const req=rid("PAYROLL");await rpc("pay_employee_payroll",{p_payroll_id:pr.id,p_financial_account_id:acct.id,p_method:"cash",p_pos_shift_id:S.shift?.id||null,p_client_request_id:req,p_notes:null});toast("تم دفع الراتب");await renderPayroll()}catch(e){toast(e.message,true)}}))
}

function renderSearch(){
 $("main").innerHTML=`<div class="card"><div class="section">بحث شامل</div><div class="row"><input id="searchQ" class="grow" placeholder="صنف، طرف، فاتورة، سند، مصدر تاريخي"><button id="doSearch" class="btn primary" type="button">بحث</button></div></div><div id="searchRes"></div>`;
 const run=async()=>{try{const d=await rpc("search_erp",{p_query:$("searchQ").value,p_limit:100});$("searchRes").innerHTML=`<div class="card tablewrap"><table class="tbl"><thead><tr><th>النوع</th><th>العنوان</th><th>التفاصيل</th><th>المبلغ</th></tr></thead><tbody>${d.map(x=>`<tr><td>${esc(x.result_type)}</td><td>${esc(x.title)}</td><td>${esc(x.subtitle||"")}</td><td>${money(x.amount)} ${esc(x.currency||"")}</td></tr>`).join("")}</tbody></table></div>`}catch(e){toast(e.message,true)}};$("doSearch").onclick=run;$("searchQ").onkeydown=e=>{if(e.key==="Enter")run()}
}

async function renderReports(){
 const [cash,so,po,exp,sh]=await Promise.all([select("v_cash_balances",{}).catch(()=>[]),select("v_sales_outstanding",{filters:[["outstanding","gt","0"]]}).catch(()=>[]),select("v_purchase_outstanding",{filters:[["outstanding","gt","0"]]}).catch(()=>[]),select("v_expense_summary_monthly",{order:"month.desc",limit:50}).catch(()=>[]),select("v_pos_shift_summary",{order:"opened_at.desc",limit:25}).catch(()=>[])]);
 $("main").innerHTML=`<div class="grid">${cash.map(x=>`<div class="card"><div class="muted">${esc(x.name+" — "+x.currency)}</div><div class="kpi">${money(x.balance)}</div></div>`).join("")}</div>
 <div class="grid"><div class="card"><div class="section">مبيعات غير مسددة</div><b>${so.length}</b></div><div class="card"><div class="section">مشتريات غير مسددة</div><b>${po.length}</b></div><div class="card"><div class="section">ورديات مسجلة</div><b>${sh.length}</b></div></div>
 <div class="card"><div class="section">المصاريف الشهرية</div><div class="tablewrap"><table class="tbl"><thead><tr><th>الشهر</th><th>التصنيف</th><th>العملة</th><th>الإجمالي</th><th>العدد</th></tr></thead><tbody>${exp.map(x=>`<tr><td>${esc(x.month)}</td><td>${esc(x.category_name)}</td><td>${esc(x.currency)}</td><td>${money(x.total_amount)}</td><td>${x.expense_count}</td></tr>`).join("")}</tbody></table></div></div>`;
}

window.addEventListener("error",e=>console.error(e.error||e.message));
window.addEventListener("unhandledrejection",e=>console.error(e.reason));
(async()=>{updateNet();if(readSession()?.access_token)await startApp()})();
</script>
