<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>غذائيات القدور ERP</title>
<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#f5f6f8;
  font-family:Arial,sans-serif;
}
#erp{
  width:100%;
  height:100%;
  border:0;
  display:none;
}
#loading{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  text-align:center;
  color:#1d2433;
  padding:20px;
  box-sizing:border-box;
}
</style>
</head>
<body>

<div id="loading">جارٍ تشغيل نظام غذائيات القدور...</div>
<iframe id="erp" title="غذائيات القدور ERP"></iframe>

<script>
(async function () {
  const loading = document.getElementById('loading');
  const frame = document.getElementById('erp');

  try {
    const response = await fetch(
      'https://sirlzuuqnygrxxvipygx.supabase.co/storage/v1/object/public/erp-public/index.html?v=' + Date.now(),
      { cache: 'no-store' }
    );

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const html = await response.text();

    frame.onload = function () {
      loading.style.display = 'none';
      frame.style.display = 'block';
    };

    frame.srcdoc = html;

  } catch (e) {
    loading.innerHTML =
      '<div><h2>تعذر تشغيل النظام</h2>' +
      '<p>أعد تحميل الصفحة أو تحقق من اتصال الإنترنت.</p>' +
      '<small>' + e.message + '</small></div>';
  }
})();
</script>

</body>
</html>
