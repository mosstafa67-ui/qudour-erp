<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>غذائيات القدور ERP</title>
</head>
<body>
<p style="font-family:Arial;text-align:center;margin-top:30vh">
جارٍ تحميل نظام غذائيات القدور...
</p>

<script>
fetch('https://sirlzuuqnygrxxvipygx.supabase.co/storage/v1/object/public/erp-public/index.html',
      {cache:'no-store'})
.then(r => r.text())
.then(html => {
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  location.replace(URL.createObjectURL(blob));
})
.catch(() => {
  document.body.innerHTML =
    '<h2 style="text-align:center">تعذر تحميل النظام</h2>';
});
</script>
</body>
</html>
