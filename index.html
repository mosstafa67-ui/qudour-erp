<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b2c">
<title>غذائيات القدور ERP / POS</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#17202b;background:#f4f6f5}
*{box-sizing:border-box}body{margin:0;background:#f4f6f5}button,input,select,textarea{font:inherit}button{cursor:pointer}
.hide{display:none!important}.shell{max-width:1180px;margin:auto;padding:10px}.card{background:#fff;border:1px solid #dde5df;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 12px #00000008}
.login{max-width:430px;margin:8vh auto}.brand{font-size:28px;font-weight:900}.muted{color:#6b756d;font-size:12px}.error{color:#a12b2b}.ok{color:#176b2c}
label{display:block;font-size:13px;margin:7px 0 4px;color:#4c574f}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cfd7d1;border-radius:11px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#2d9154;box-shadow:0 0 0 3px #2d915418}
textarea{min-height:74px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:150px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}
.btn{border:1px solid #ccd5cf;background:#fff;border-radius:11px;padding:10px 14px}.primary{background:#176b2c;color:#fff;border-color:#176b2c}.danger{background:#982f2f;color:#fff;border-color:#982f2f}.soft{background:#eef6f0}.btn:disabled{opacity:.55;cursor:wait}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dfe5e1}.topin{max-width:1180px;margin:auto;padding:9px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick{min-height:88px;border:1px solid #b9c9bd;border-radius:16px;background:#eef3ef;padding:12px;font-weight:850;font-size:18px;text-align:center;display:flex;align-items:center;justify-content:center}.quick:hover{background:#e2eee5}.quick.owner{background:#fff6df}
.section{font-size:19px;font-weight:900;margin-bottom:10px}.kpi{font-size:24px;font-weight:900}.nav{display:flex;gap:6px;overflow:auto;padding:7px 0}.nav .btn{white-space:nowrap}.nav .active{background:#176b2c;color:#fff;border-color:#176b2c}
.tablewrap{overflow:auto;max-height:65vh}.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{padding:8px;border-bottom:1px solid #edf0ee;text-align:right;vertical-align:middle}.tbl th{background:#fafcfa;position:sticky;top:0;z-index:2}
.product-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;max-height:44vh;overflow:auto}.product{background:#fff;border:1px solid #dae3dc;border-radius:12px;padding:10px;text-align:right}.product .name{font-weight:800}.price{font-size:18px;font-weight:900}.small{font-size:12px}.pill{display:inline-block;padding:3px 8px;border:1px solid #d4ddd6;border-radius:999px;font-size:12px}
.line{display:grid;grid-template-columns:2fr 90px 110px auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #eee}.total{font-size:28px;font-weight:950;text-align:left}.modal{position:fixed;inset:0;background:#0008;z-index:60;display:flex;align-items:center;justify-content:center;padding:12px}.modalbox{background:#fff;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:15px}
.toast{position:fixed;left:12px;bottom:12px;z-index:100;background:#17202b;color:#fff;padding:11px 14px;border-radius:11px;display:none;max-width:380px}.warn{background:#fff7df}.bad{background:#fdecec}.good{background:#eaf7ed}.sticky{position:sticky;bottom:0;background:#fff;padding-top:10px;border-top:1px solid #eee}.mono{font-family:ui-monospace,Consolas,monospace;direction:ltr;text-align:left;white-space:pre-wrap}
@media(max-width:680px){.shell{padding:8px}.card{padding:11px}.quick{font-size:17px;min-height:82px}.line{grid-template-columns:1fr 78px 95px}.line .nm{grid-column:1/-1}.total{font-size:23px}.topin{align-items:flex-start}.topin>.row{justify-content:flex-end}}
@media print{.top,.nav,.btn,.no-print{display:none!important}.shell{max-width:none}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<section id="auth" class="shell"><div class="card login"><div class="brand">غذائيات القدور</div><div class="muted">ERP / POS — دخول الموظفين المصرح لهم</div><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email"><label>كلمة المرور</label><input id="pass" type="password" autocomplete="current-password"><div class="row" style="margin-top:12px"><button id="login" class="btn primary grow">دخول</button><button id="signup" class="btn grow">تفعيل حساب موظف</button></div><div id="authMsg" class="muted" style="margin-top:8px"></div></div></section>
<section id="app" class="hide"><header class="top"><div class="topin"><div><b>غذائيات القدور</b><div id="who" class="muted"></div></div><div class="row"><span id="net" class="pill"></span><span id="shiftBadge" class="pill"></span><button id="homeBtn" class="btn">الرئيسية</button><button id="logout" class="btn">خروج</button></div></div></header><div class="shell"><div id="nav" class="nav"></div><main id="main"></main></div></section>
<div id="modal" class="modal hide"><div id="modalBox" class="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
"use strict";
const BASE="https://sirlzuuqnygrxxvipygx.supabase.co";
const KEY="sb_publishable_dvgfbh2SiWdg76EN5BawEw_scEcawBX";
const UI_VERSION="5.1";
const SESSION="qudour_erp_v4";
const $=x=>document.getElementById(x);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>Number(v??0).toLocaleString("ar-EG",{maximumFractionDigits:2});
const qty=v=>Number(v??0).toLocaleString("ar-EG",{maximumFractionDigits:3});
const today=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Damascus"});
const firstOfMonth=()=>today().slice(0,8)+"01";
const rid=p=>p+"-"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2));
const S={profile:null,employeeId:null,products:[],parties:[],accounts:[],stores:[],registers:[],expenseCats:[],shift:null,stock:new Map(),sale:[],purchase:[],lastPurchases:[],posOnly:false};

function friendly(m){return String(m||"").replace("Open POS shift is required","يجب فتح وردية قبل البيع").replace("Not authorized","لا توجد صلاحية لهذه العملية").replace("Invalid customer","العميل غير صالح").replace("Invalid supplier","المورد غير صالح").replace("Insufficient stock","المخزون غير كافٍ").replace("Credit limit exceeded","تم تجاوز حد الائتمان").replace("Opening count is incomplete","الجرد الافتتاحي غير مكتمل");}
function toast(m,bad=false){const t=$("toast");t.textContent=friendly(m);t.style.background=bad?"#982f2f":"#17202b";t.style.display="block";setTimeout(()=>t.style.display="none",4200)}
function showModal(h){$("modalBox").innerHTML=h;$("modal").classList.remove("hide")}
function closeModal(){$("modal").classList.add("hide");$("modalBox").innerHTML=""}
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
function session(){try{return JSON.parse(localStorage.getItem(SESSION)||"null")}catch{return null}}
function saveSession(s){if(s)localStorage.setItem(SESSION,JSON.stringify(s));else localStorage.removeItem(SESSION)}
function parseErr(j,s){return j&&typeof j==="object"?(j.message||j.msg||j.error_description||j.error||("HTTP "+s)):String(j||("HTTP "+s))}
async function refresh(){const s=session();if(!s?.refresh_token)return null;try{const r=await fetch(BASE+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"content-type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.access_token){saveSession(null);return null}saveSession(j);return j}catch{saveSession(null);return null}}
async function api(path,{method="GET",body=null,headers={},auth=true,retry=true}={}){let s=session();if(auth&&s?.expires_at&&Date.now()/1000>Number(s.expires_at)-60)s=await refresh();const h={apikey:KEY,...headers};if(auth&&s?.access_token)h.authorization="Bearer "+s.access_token;let r;try{r=await fetch(BASE+path,{method,headers:h,body:body===null?null:JSON.stringify(body)})}catch{throw new Error("تعذر الاتصال بالخادم. لم يتم حذف السلة؛ أعد المحاولة عند عودة الإنترنت.")}if(r.status===401&&retry&&auth&&session()?.refresh_token){const n=await refresh();if(n)return api(path,{method,body,headers,auth,retry:false})}const tx=await r.text();let d=null;if(tx){try{d=JSON.parse(tx)}catch{d=tx}}if(!r.ok)throw new Error(parseErr(d,r.status));return d}
async function rpc(n,a={}){return api("/rest/v1/rpc/"+encodeURIComponent(n),{method:"POST",headers:{"content-type":"application/json"},body:a})}
async function select(t,{columns="*",filters=[],order=null,limit=null}={}){const u=new URL(BASE+"/rest/v1/"+encodeURIComponent(t));u.searchParams.set("select",columns);for(const [c,o,v] of filters)u.searchParams.append(c,o+"."+String(v));if(order)u.searchParams.set("order",order);if(limit!=null)u.searchParams.set("limit",String(limit));return api(u.pathname+u.search)}
async function signIn(email,password){const r=await fetch(BASE+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"content-type":"application/json"},body:JSON.stringify({email,password})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(parseErr(j,r.status));saveSession(j);return j}
async function signUp(email,password){const r=await fetch(BASE+"/auth/v1/signup",{method:"POST",headers:{apikey:KEY,"content-type":"application/json"},body:JSON.stringify({email,password})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(parseErr(j,r.status));if(j.access_token)saveSession(j);return j}
async function signOut(){const s=session();if(s?.access_token)try{await fetch(BASE+"/auth/v1/logout",{method:"POST",headers:{apikey:KEY,authorization:"Bearer "+s.access_token}})}catch{}saveSession(null)}
function has(k){return ["owner","admin"].includes(S.profile?.role)||!!S.profile?.permissions?.admin||!!S.profile?.permissions?.[k]}
async function lock(btn,fn){if(btn.disabled)return;const x=btn.textContent;btn.disabled=true;btn.textContent="جارٍ التنفيذ...";try{return await fn()}finally{btn.disabled=false;btn.textContent=x}}
function pending(k,p){let v=sessionStorage.getItem(k);if(!v){v=rid(p);sessionStorage.setItem(k,v)}return v}
function clearPending(k){sessionStorage.removeItem(k)}
function updateNet(){if(!$("net"))return;$("net").textContent=navigator.onLine?"متصل":"بدون اتصال";$("net").className="pill "+(navigator.onLine?"ok":"error")}
addEventListener("online",updateNet);addEventListener("offline",updateNet);

$("login").onclick=()=>lock($("login"),async()=>{try{$("authMsg").className="muted";$("authMsg").textContent="جارٍ الدخول...";if(!$("email").value.trim()||!$("pass").value)throw new Error("أدخل البريد وكلمة المرور");await signIn($("email").value.trim(),$("pass").value);await start()}catch(e){$("authMsg").className="error";$("authMsg").textContent=friendly(e.message)}});
$("signup").onclick=()=>lock($("signup"),async()=>{try{const em=$("email").value.trim(),pw=$("pass").value;if(!em||pw.length<8)throw new Error("أدخل بريدًا صحيحًا وكلمة مرور 8 أحرف على الأقل");const j=await signUp(em,pw);if(j.access_token)await start();else{$("authMsg").className="ok";$("authMsg").textContent="تم إنشاء الحساب. أكد البريد إن طُلب ثم سجّل الدخول."}}catch(e){$("authMsg").className="error";$("authMsg").textContent=friendly(e.message)}});
$("logout").onclick=async()=>{await signOut();location.reload()};$("homeBtn").onclick=()=>home();

async function start(){try{await rpc("claim_employee_account",{}).catch(()=>null);const p=await rpc("my_profile",{});if(!Array.isArray(p)||!p.length)throw new Error("الحساب غير مربوط بموظف فعال");S.profile=p[0];S.employeeId=await rpc("current_employee_id",{});S.posOnly=["cashier","pos_worker"].includes(S.profile.role);await loadBase();$("who").textContent=(S.profile.name||"")+" — "+roleName(S.profile.role);$("auth").classList.add("hide");$("app").classList.remove("hide");buildNav();updateNet();home()}catch(e){await signOut();$("authMsg").className="error";$("authMsg").textContent=friendly(e.message)}}
function roleName(r){return {owner:"المالك",manager:"مدير",cashier:"كاشير",pos_worker:"عامل نقطة بيع",purchasing:"مشتريات",price_worker:"أسعار",accountant:"محاسب"}[r]||r||""}
async function loadBase(){
 if(S.profile.role==="price_worker"){S.products=[];S.parties=[];S.accounts=[];S.stores=[];S.registers=[];S.expenseCats=[];S.shift=null;return}
 if(S.posOnly){const b=await rpc("pos_bootstrap",{});S.products=(b.products||[]).map(x=>({...x,status:"active"}));S.parties=(b.customers||[]).map(x=>({...x,is_customer:true,is_supplier:false,status:"active"}));S.accounts=[];S.stores=b.store_id?[{id:b.store_id,code:"MAIN",name:"الرئيسي"}]:[];S.registers=b.registers||[];S.expenseCats=[];S.shift=b.shift||null;S.stock=new Map(S.products.map(p=>[(b.store_id||"")+"|"+p.product_id,{quantity:p.stock_quantity||0,avg_cost_base:0}]));S.lastPurchases=[];updateShiftBadge();return}
 const b=await rpc("app_bootstrap_v1",{});
 S.products=(b.products||[]).map(x=>({...x,status:x.status||"active"}));
 S.parties=(b.parties||[]).map(x=>({...x,status:"active"}));
 S.accounts=b.financial_accounts||[];S.stores=b.stores||[];S.registers=b.registers||[];S.expenseCats=b.expense_categories||[];S.shift=b.open_shift||null;
 const sid=S.stores[0]?.id||"";S.stock=new Map(S.products.map(p=>[sid+"|"+p.product_id,{quantity:Number(p.stock_quantity||0),avg_cost_base:0}]));
 S.lastPurchases=await rpc("product_last_purchase",{}).catch(()=>[]);updateShiftBadge();
}
async function refreshShift(){if(!S.employeeId){S.shift=null;updateShiftBadge();return}const r=await select("pos_shifts",{columns:"id,register_id,employee_id,opened_at,status",filters:[["employee_id","eq",S.employeeId],["status","eq","open"]],order:"opened_at.desc",limit:1}).catch(()=>[]);S.shift=r?.[0]||null;updateShiftBadge()}
function updateShiftBadge(){if(!$("shiftBadge"))return;$("shiftBadge").textContent=S.shift?"وردية مفتوحة":"لا توجد وردية";$("shiftBadge").className="pill "+(S.shift?"ok":"error")}
function buildNav(){let nav;if(S.profile.role==="price_worker")nav=[["priceOnly","الأسعار"]];else if(S.posOnly)nav=[["sale","بيع"],["products","الأسعار"],["shift","الوردية"]];else{nav=[["sale","بيع"],["purchase","شراء"],["parties","العملاء والموردون"],["products","الأصناف"],["payments","قبض/دفع"],["expenses","مصاريف"],["search","بحث"],["reports","تقارير"]];if(["owner","admin","manager"].includes(S.profile.role))nav.push(["history","مراجعة التاريخ"],["startup","بدء التشغيل"],["employees","الموظفون"],["cycle","دورة مالية"]);nav.push(["shift","الوردية"])}$("nav").innerHTML=nav.map(([k,l])=>`<button class="btn" data-p="${k}">${l}</button>`).join("");$("nav").onclick=e=>{const b=e.target.closest("[data-p]");if(b)go(b.dataset.p)}}
function quick(k,l,owner=false){return `<button class="quick ${owner?"owner":""}" data-q="${k}">${l}</button>`}
function home(){document.querySelectorAll("#nav .btn").forEach(b=>b.classList.remove("active"));if(S.profile.role==="price_worker")return go("priceOnly");if(S.posOnly){$("main").innerHTML=`<div class="card"><div class="section">نقطة البيع</div><div class="quick-grid">${quick("sale","فاتورة بيع جديدة")}${quick("products","بحث سعر صنف")}${quick("shift",S.shift?"إغلاق الوردية":"فتح الوردية")}</div></div>`;$("main").onclick=e=>{const b=e.target.closest("[data-q]");if(b)go(b.dataset.q)};return}const owner=["owner","admin","manager"].includes(S.profile.role);$("main").innerHTML=`<div class="card"><div class="section">ماذا تريد أن تفعل؟</div><div class="quick-grid">${quick("sale","فاتورة بيع جديدة")}${quick("purchase","فاتورة شراء جديدة")}${quick("parties","الموردون والعملاء")}${quick("products","بحث الأصناف")}${quick("payments","التحصيل والمديونية")}${quick("reports","التقارير")}${owner?quick("history","مراجعة الفواتير القديمة",true):""}${owner?quick("startup","تهيئة البداية",true):""}${owner?quick("employees","الموظفون والأجور",true):""}</div></div><div class="card ${S.shift?"good":"warn"}"><b>${S.shift?"الوردية مفتوحة":"الوردية مغلقة"}</b> — <button id="shiftAction" class="btn">${S.shift?"إغلاق/مراجعة الوردية":"فتح وردية"}</button></div>`;$("main").onclick=e=>{const b=e.target.closest("[data-q]");if(b)go(b.dataset.q)};$("shiftAction").onclick=()=>go("shift")}
async function go(p){document.querySelectorAll("#nav [data-p]").forEach(b=>b.classList.toggle("active",b.dataset.p===p));$("main").innerHTML='<div class="card">جارٍ التحميل...</div>';try{if(p==="sale")saleUI();else if(p==="purchase")purchaseUI();else if(p==="parties")await partiesUI();else if(p==="products")productsUI();else if(p==="priceOnly")await priceOnlyUI();else if(p==="payments")paymentUI();else if(p==="expenses")expenseUI();else if(p==="reports")reportsUI();else if(p==="search")searchUI();else if(p==="history")await historyUI();else if(p==="startup")await startupUI();else if(p==="employees")await employeesUI();else if(p==="cycle")await cycleUI();else if(p==="shift")await shiftUI()}catch(e){$("main").innerHTML=`<div class="card bad">${esc(friendly(e.message))}</div>`}}

function partyOpts(kind,blank=false){let a=S.parties.filter(p=>kind==="customer"?p.is_customer:p.is_supplier);return (blank?'<option value="">نقدي / بدون طرف</option>':"")+a.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}
function stockFor(pid){const sid=S.stores[0]?.id||"";return S.stock.get(sid+"|"+pid)||{quantity:0,avg_cost_base:0}}
function findProducts(q){q=String(q||"").trim().toLowerCase();return S.products.filter(p=>!q||[p.product_code,p.name,p.barcode].some(v=>String(v||"").toLowerCase().includes(q))).slice(0,100)}
function productSalePrice(p){return Number(p.sale_price)||0}function productPurchasePrice(p){return Number(p.purchase_reference)||0}
function cards(q,mode){return `<div class="product-list">${findProducts(q).map(p=>`<button class="product" data-add="${p.product_id}"><div class="small muted">${esc(p.product_code)} ${p.barcode?" • "+esc(p.barcode):""}</div><div class="name">${esc(p.name)}</div><div class="price">${money(mode==="sale"?productSalePrice(p):productPurchasePrice(p))} ${esc(mode==="sale"?(p.sale_currency||"SYP"):(p.purchase_currency||""))}</div><div class="small">المخزون: ${qty(stockFor(p.product_id).quantity)}</div></button>`).join("")}</div>`}
function cartHtml(cart){return cart.length?cart.map((x,i)=>`<div class="line"><div class="nm"><b>${esc(x.name)}</b><div class="small muted">${esc(x.code)}</div></div><input data-q="${i}" type="number" step="any" min=".001" value="${x.quantity}"><input data-p="${i}" type="number" step="any" min="0" value="${x.unit_price}"><button class="btn" data-del="${i}">×</button></div>`).join(""):'<div class="muted">لم تضف أصنافًا بعد.</div>'}
function bindCart(cart,refresh){$("cart").querySelectorAll("[data-q]").forEach(x=>x.onchange=()=>{cart[+x.dataset.q].quantity=Math.max(.001,Number(x.value)||.001);refresh()});$("cart").querySelectorAll("[data-p]").forEach(x=>x.onchange=()=>{cart[+x.dataset.p].unit_price=Math.max(0,Number(x.value)||0);refresh()});$("cart").querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{cart.splice(+x.dataset.del,1);refresh()})}
function docTotal(cart){return cart.reduce((a,b)=>a+b.quantity*b.unit_price,0)}
function documentUI(mode){const sale=mode==="sale",cart=sale?S.sale:S.purchase;if(sale&&!has("sales"))throw new Error("لا توجد صلاحية بيع");if(!sale&&!has("purchases"))throw new Error("لا توجد صلاحية شراء");$("main").innerHTML=`<div class="card"><div class="section">${sale?"فاتورة بيع":"فاتورة شراء"}</div><div class="grid"><select id="party">${partyOpts(sale?"customer":"supplier",sale)}</select><select id="cur"><option>SYP</option><option>USD</option></select><input id="date" type="date" value="${today()}">${sale?"":'<input id="supplierNo" placeholder="رقم فاتورة المورد">'}</div></div><div class="card"><div class="row"><input id="pq" class="grow" placeholder="اسم الصنف أو الكود أو الباركود" autofocus><button id="findBtn" class="btn">بحث</button></div><div id="cards">${cards("",mode)}</div></div><div class="card"><div id="cart"></div><div class="total">الإجمالي: <span id="tot">0</span></div><div class="sticky"><button id="finish" class="btn primary" style="width:100%;font-size:18px">${sale?"دفع وإتمام البيع":"دفع وإتمام الشراء"}</button></div></div>`;const refreshCart=()=>{$("cart").innerHTML=cartHtml(cart);$("tot").textContent=money(docTotal(cart));bindCart(cart,refreshCart)};refreshCart();const renderCards=()=>{$("cards").innerHTML=cards($("pq").value,mode);$("cards").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const p=S.products.find(x=>x.product_id===b.dataset.add);const ex=cart.find(x=>x.product_id===p.product_id);if(ex)ex.quantity+=1;else cart.push({product_id:p.product_id,name:p.name,code:p.product_code,quantity:1,unit_price:Number(sale?productSalePrice(p):productPurchasePrice(p))||0});refreshCart()})};$("pq").oninput=renderCards;$("pq").onkeydown=e=>{if(e.key==="Enter"){const exact=S.products.find(p=>String(p.barcode||"")===$("pq").value.trim()||String(p.product_code||"")===$("pq").value.trim());if(exact){const ex=cart.find(x=>x.product_id===exact.product_id);if(ex)ex.quantity+=1;else cart.push({product_id:exact.product_id,name:exact.name,code:exact.product_code,quantity:1,unit_price:Number(sale?productSalePrice(exact):productPurchasePrice(exact))||0});$("pq").value="";refreshCart();renderCards()}}};$("findBtn").onclick=renderCards;renderCards();$("finish").onclick=()=>paymentModal(mode,cart)}

async function partyBalance(pid,cur,type){if(!pid)return 0;try{const x=await rpc("party_quick_balance",{p_party_id:pid,p_currency:cur,p_account_type:type});return Number(x?.balance||0)}catch{return 0}}
async function paymentModal(mode,cart){if(!cart.length)return toast("أضف صنفًا واحدًا على الأقل",true);const sale=mode==="sale",gross=docTotal(cart),pid=$("party").value||null,cur=$("cur").value;let bal=await partyBalance(pid,cur,sale?"receivable":"payable");showModal(`<div class="section">${sale?"إتمام البيع":"إتمام الشراء"}</div><div class="grid"><div class="card soft"><div class="muted">إجمالي البنود</div><div class="kpi">${money(gross)}</div></div><div class="card"><div class="muted">الحساب الحالي</div><div class="kpi">${money(bal)} ${esc(cur)}</div></div></div><label>طريقة الدفع</label><select id="settleType"><option value="cash">نقدي كامل</option><option value="credit">آجل</option><option value="partial">جزئي نقدي</option><option value="bank_transfer">حوالة كاملة</option><option value="check">شيك كامل</option></select><label>المدفوع</label><input id="paid" type="number" step="any" min="0" value="${gross}"><label>خصم بالقيمة</label><input id="disc" type="number" step="any" min="0" value="0"><label>خصم %</label><input id="discPct" type="number" step="any" min="0" max="100" value="0"><div class="card soft" style="margin-top:10px"><div>الصافي: <b id="net">${money(gross)}</b></div><div>الباقي: <b id="remain">0</b></div><div>الحساب بعد العملية: <b id="after">${money(bal)}</b></div></div><textarea id="notes" placeholder="ملاحظات"></textarea><div class="row"><button id="commit" class="btn primary grow">حفظ وإتمام</button><button id="cancel" class="btn grow">إلغاء</button></div>`);
 const recalc=src=>{if(src==="disc"&&Number($("disc").value)>0)$("discPct").value=0;if(src==="discPct"&&Number($("discPct").value)>0)$("disc").value=0;const da=Math.max(0,Number($("disc").value)||0),dp=Math.max(0,Math.min(100,Number($("discPct").value)||0)),net=Math.max(0,gross-da-(gross*dp/100));let paid=Math.max(0,Number($("paid").value)||0);const st=$("settleType").value;if(st==="cash"||st==="bank_transfer"||st==="check")paid=net;if(st==="credit")paid=0;$("paid").value=paid;const rem=Math.max(0,net-paid);$("net").textContent=money(net);$("remain").textContent=money(rem);$("after").textContent=money(bal+rem)};
 $("settleType").onchange=()=>recalc("type");$("paid").oninput=()=>recalc("paid");$("disc").oninput=()=>recalc("disc");$("discPct").oninput=()=>recalc("discPct");recalc();$("cancel").onclick=closeModal;
 $("commit").onclick=()=>lock($("commit"),async()=>{try{const da=Math.max(0,Number($("disc").value)||0),dp=Math.max(0,Math.min(100,Number($("discPct").value)||0));const net=Math.max(0,gross-da-(gross*dp/100));let paid=Math.max(0,Number($("paid").value)||0);const st=$("settleType").value;if(st==="cash"||st==="bank_transfer"||st==="check")paid=net;if(st==="credit")paid=0;if(paid>net)throw new Error("المدفوع أكبر من صافي الفاتورة");if(sale&&!pid&&net-paid>0)throw new Error("البيع الآجل يتطلب اختيار عميل");const method=st==="partial"?"cash":st;const settlements=paid>0?[{amount:paid,method}]:[];const key=sale?"sale_req":"purchase_req",req=pending(key,sale?"SALE":"PUR");const args={p_party_id:pid,p_store_id:S.stores[0]?.id||null,p_currency:cur,p_invoice_date:$("date").value,p_lines:cart.map(x=>({product_id:x.product_id,quantity:x.quantity,unit_price:x.unit_price})),p_settlements:settlements,p_discount_amount:da,p_discount_percent:dp,p_document_type:"invoice",p_original_invoice_id:null,p_due_date:null,p_notes:$("notes").value||null,p_pos_shift_id:S.shift?.id||null,p_client_request_id:req};if(sale)args.p_external_ref=null;else args.p_supplier_invoice_no=$("supplierNo")?.value||null;const d=await rpc(sale?"create_sales_pos":"create_purchase_pos",args);clearPending(key);cart.splice(0,cart.length);closeModal();await loadBase();showSuccess(d,mode)}catch(e){toast(e.message,true)}})
}
function showSuccess(d,mode){const txt=`غذائيات القدور\n${mode==="sale"?"فاتورة بيع":"فاتورة شراء"}: ${d.invoice_no||""}\nالإجمالي: ${money(d.total_amount)}\nالمدفوع: ${money(d.settled_amount)}\nالباقي: ${money(d.remaining_amount)}`;showModal(`<div class="section">تمت العملية بنجاح</div><div class="card good"><div class="kpi">${esc(d.invoice_no||"")}</div><div>الإجمالي: <b>${money(d.total_amount)}</b></div><div>المدفوع: <b>${money(d.settled_amount)}</b></div><div>الباقي: <b>${money(d.remaining_amount)}</b></div></div><div class="grid"><button id="printInvoice" class="btn">طباعة / PDF</button><button id="shareInvoice" class="btn">مشاركة</button><button id="again" class="btn primary">فاتورة جديدة</button><button id="done" class="btn">الرئيسية</button></div>`);$("printInvoice").onclick=()=>window.print();$("shareInvoice").onclick=async()=>{try{if(navigator.share)await navigator.share({title:"غذائيات القدور",text:txt});else await navigator.clipboard.writeText(txt)}catch{}};$("again").onclick=()=>{closeModal();go(mode)};$("done").onclick=()=>{closeModal();home()}}

async function employeesUI(){if(!["owner","admin","manager"].includes(S.profile.role))throw new Error("للإدارة فقط");const em=await rpc("list_employees_management",{});$("main").innerHTML=`<div class="card"><div class="section">الموظفون والأجور اليومية</div><button id="addEmp" class="btn primary">إضافة موظف</button></div><div class="card tablewrap"><table class="tbl"><tr><th>الموظف</th><th>الدور</th><th>الأجر اليومي</th><th>الحالة</th><th></th></tr>${em.map(e=>`<tr><td><b>${esc(e.name)}</b><div class="muted">${esc(e.email||"")} — ${esc(e.employee_code)}</div></td><td>${esc(roleName(e.role))}</td><td>${money(e.daily_rate)} ${esc(e.currency||"")}</td><td>${esc(e.status)}</td><td><button class="btn" data-e="${e.employee_id}">إدارة</button></td></tr>`).join("")}</table></div>`;$("addEmp").onclick=()=>employeeModal(null);document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>employeeModal(em.find(e=>e.employee_id===b.dataset.e)))}
function employeeModal(e){showModal(`<div class="section">${e?"إدارة الموظف":"إضافة موظف"}</div><label>الاسم</label><input id="ename" value="${esc(e?.name||"")}"><label>البريد</label><input id="eemail" value="${esc(e?.email||"")}"><label>الهاتف</label><input id="ephone" value="${esc(e?.phone||"")}"><label>الدور</label><select id="erole"><option value="cashier">كاشير</option><option value="pos_worker">عامل نقطة بيع</option><option value="purchasing">مشتريات</option><option value="price_worker">أسعار فقط</option><option value="accountant">محاسب</option><option value="manager">مدير</option></select><div class="grid"><div><label>الأجر اليومي</label><input id="daily" type="number" min="0" step="any" value="${e?.daily_rate??0}"></div><div><label>مواصلات يومية</label><input id="transDay" type="number" min="0" step="any" value="${e?.transport_per_workday??0}"></div><div><label>العملة</label><select id="ecur2"><option>SYP</option><option>USD</option></select></div></div><button id="saveEmp" class="btn primary" style="width:100%;margin-top:8px">حفظ</button>${e?'<hr><div class="section">اليوم والحركات</div><div class="grid"><input id="wdate" type="date" value="'+today()+'"><select id="wunits"><option value="1">يوم كامل</option><option value=".5">نصف يوم</option><option value="0">غياب</option></select><input id="transport" type="number" min="0" step="any" placeholder="مواصلات إضافية لهذا اليوم"></div><button id="saveAtt" class="btn" style="width:100%;margin-top:8px">تسجيل اليوم</button><div class="grid" style="margin-top:8px"><select id="adjType"><option value="bonus">مكافأة</option><option value="advance">سلفة</option><option value="deduction">خصم</option><option value="extra">إضافة</option><option value="transport">مواصلات إضافية</option></select><input id="adjAmt" type="number" min="0" step="any" placeholder="المبلغ"></div><button id="saveAdj" class="btn" style="width:100%;margin-top:8px">تسجيل الحركة</button><hr><div class="section">تسوية الأجر</div><div class="grid"><input id="pf" type="date" value="'+firstOfMonth()+'"><input id="pt" type="date" value="'+today()+'"></div><div class="row" style="margin-top:8px"><button id="previewPayroll" class="btn grow">معاينة</button><button id="finalPayroll" class="btn primary grow">إنشاء التسوية</button><button id="statementEmp" class="btn grow">كشف الموظف</button></div><div id="payPreview"></div>':""}`);if(e){$("erole").value=e.role;if(e.currency)$("ecur2").value=e.currency}$("saveEmp").onclick=async()=>{try{const d=await rpc("manage_employee",{p_employee_id:e?.employee_id||null,p_employee_code:e?.employee_code||null,p_name:$("ename").value,p_phone:$("ephone").value||null,p_email:$("eemail").value||null,p_role:$("erole").value,p_status:"active"});const id=e?.employee_id||d.employee_id;if(Number($("daily").value)>=0)await rpc("set_employee_daily_rate_v2",{p_employee_id:id,p_effective_from:today(),p_daily_rate:Number($("daily").value||0),p_transport_per_workday:Number($("transDay").value||0),p_currency:$("ecur2").value,p_notes:null});closeModal();toast("تم حفظ الموظف");employeesUI()}catch(x){toast(x.message,true)}};if(e){$("saveAtt").onclick=async()=>{try{await rpc("upsert_employee_attendance",{p_employee_id:e.employee_id,p_work_date:$("wdate").value,p_work_units:Number($("wunits").value),p_status:null,p_transport_amount:Number($("transport").value||0),p_notes:null});toast("تم تسجيل اليوم")}catch(x){toast(x.message,true)}};$("saveAdj").onclick=async()=>{try{const a=Number($("adjAmt").value);if(!(a>0))throw new Error("أدخل المبلغ");await rpc("create_employee_adjustment",{p_employee_id:e.employee_id,p_adjustment_type:$("adjType").value,p_amount:a,p_currency:$("ecur2").value,p_adjustment_date:today(),p_pay_advance_now:$("adjType").value==="advance",p_financial_account_id:S.accounts.find(x=>x.currency===$("ecur2").value&&x.account_type==="cash")?.id||null,p_pos_shift_id:S.shift?.id||null,p_client_request_id:pending("adj_req","EMP"),p_notes:null});clearPending("adj_req");toast("تم تسجيل الحركة")}catch(x){toast(x.message,true)}};$("previewPayroll").onclick=async()=>{try{const d=await rpc("employee_payroll_preview",{p_employee_id:e.employee_id,p_period_start:$("pf").value,p_period_end:$("pt").value});$("payPreview").innerHTML=`<div class="card soft" style="margin-top:8px"><div>أيام العمل: <b>${qty(d.work_units)}</b></div><div>الأجر الأساسي: <b>${money(d.base_amount)}</b></div><div>مكافآت: ${money(d.bonus)} — مواصلات: ${money(d.transportation)} — إضافات: ${money(d.extra)}</div><div>خصومات: ${money(d.deduction)} — سلف: ${money(d.advance)}</div><div class="kpi">الصافي: ${money(d.net_amount)} ${esc(d.currency)}</div></div>`}catch(x){toast(x.message,true)}};$("finalPayroll").onclick=async()=>{if(!confirm("إنشاء تسوية الأجر لهذه الفترة؟"))return;try{const d=await rpc("finalize_employee_payroll_daily",{p_employee_id:e.employee_id,p_period_start:$("pf").value,p_period_end:$("pt").value,p_notes:null});toast("تم إنشاء التسوية: "+money(d.net_amount)+" "+d.currency)}catch(x){toast(x.message,true)}};$("statementEmp").onclick=async()=>{try{const d=await rpc("employee_statement",{p_employee_id:e.employee_id,p_from:$("pf").value,p_to:$("pt").value});showModal(`<div class="section">كشف الموظف — ${esc(e.name)}</div><div class="tablewrap"><table class="tbl"><tr><th>التاريخ</th><th>النوع</th><th>مستحق</th><th>خصم</th><th>سلفة</th><th>مدفوع</th><th>العملة</th></tr>${d.map(x=>`<tr><td>${esc(x.entry_date)}</td><td>${esc(x.entry_type)}</td><td>${money(x.earning)}</td><td>${money(x.deduction)}</td><td>${money(x.advance)}</td><td>${money(x.paid)}</td><td>${esc(x.currency)}</td></tr>`).join("")}</table></div><button class="btn" onclick="window.print()">طباعة / PDF</button>`)}catch(x){toast(x.message,true)}}}}

async function cycleUI(){if(!["owner","admin"].includes(S.profile.role))throw new Error("للمالك فقط");const p=await rpc("preview_new_financial_cycle",{p_start_date:today()});$("main").innerHTML=`<div class="card bad"><div class="section">بدء دورة مالية جديدة</div><p>لا تُحذف البيانات القديمة. تُحفظ لقطة ثم تنشأ تسويات جديدة حسب الاختيارات.</p><pre class="mono">${esc(JSON.stringify(p,null,2))}</pre></div><div class="card"><div class="grid"><label><input id="rstock" type="checkbox"> تصفير المخزون</label><label><input id="rcash" type="checkbox"> تصفير الصندوق</label><label><input id="rrec" type="checkbox"> تصفير ذمم العملاء</label><label><input id="rpay" type="checkbox"> تصفير ذمم الموردين</label></div><input id="phrase" placeholder='اكتب: ابدأ دورة مالية جديدة' style="margin-top:8px"><button id="startCycle" class="btn danger" style="width:100%;margin-top:8px">بدء الدورة</button></div>`;$("startCycle").onclick=()=>lock($("startCycle"),async()=>{if($("phrase").value!=="ابدأ دورة مالية جديدة")return toast("اكتب عبارة التأكيد كاملة",true);if(!confirm("تأكيد نهائي: بدء دورة مالية جديدة؟"))return;try{await rpc("start_new_financial_cycle",{p_start_date:today(),p_reset_stock:$("rstock").checked,p_reset_cash:$("rcash").checked,p_reset_receivables:$("rrec").checked,p_reset_payables:$("rpay").checked,p_confirm_phrase:$("phrase").value,p_client_request_id:pending("cycle_req","CYCLE"),p_notes:"من واجهة المالك"});clearPending("cycle_req");toast("تم بدء الدورة الجديدة");await loadBase();home()}catch(e){toast(e.message,true)}})}

(async()=>{if(session()?.access_token)await start()})();
</script>
