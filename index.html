<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#182033">
<title>غذائيات القدور ERP</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#182033;background:#f5f6f8}
*{box-sizing:border-box}body{margin:0;background:#f5f6f8}button,input,select,textarea{font:inherit}
.shell{max-width:1180px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e0e3e8;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 4px 18px #00000008}
.login{max-width:440px;margin:8vh auto}.brand{font-size:28px;font-weight:800;margin:0 0 6px}.muted{color:#6e7684;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.grow{flex:1;min-width:160px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cfd4dc;border-radius:10px;background:#fff}textarea{min-height:72px}
button{border:1px solid #ccd2db;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.primary{background:#182033;color:#fff;border-color:#182033}.danger{background:#8e2323;color:#fff;border-color:#8e2323}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e3e5e8}.topin{max-width:1180px;margin:auto;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.nav{display:flex;gap:7px;overflow:auto;padding:9px 0}.nav button{white-space:nowrap}.nav button.active{background:#182033;color:#fff}
.hide{display:none!important}.msg{margin-top:12px;white-space:pre-wrap}.error{color:#9d2424}.ok{color:#176b2c}.warnbox{background:#fff6df;border-color:#ecd18a}.dangerbox{background:#fdeaea;border-color:#efb1b1}
.kpi{font-size:26px;font-weight:800}.section{font-size:18px;font-weight:800;margin-bottom:10px}
.tablewrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:8px;border-bottom:1px solid #eee;text-align:right;vertical-align:top}.tbl th{background:#fafafa;position:sticky;top:0}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}.pill{display:inline-block;border-radius:999px;border:1px solid #d9dde3;padding:3px 8px;font-size:12px}
.line{display:grid;grid-template-columns:2fr .7fr .9fr auto;gap:7px;align-items:center;margin:7px 0}.toast{position:fixed;left:16px;bottom:16px;z-index:99;background:#182033;color:#fff;padding:12px 14px;border-radius:12px;max-width:360px;display:none}
@media(max-width:650px){.line{grid-template-columns:1fr 1fr}.line .wide{grid-column:1/-1}.brand{font-size:24px}}
</style>
</head>
<body>

<section id="authView" class="shell">
  <div class="card login">
    <h1 class="brand">غذائيات القدور</h1>
    <p class="muted">نظام المبيعات والمشتريات والمخزون</p>
    <label>البريد الإلكتروني</label>
    <input id="authEmail" type="email" autocomplete="email">
    <br><br>
    <label>كلمة المرور</label>
    <input id="authPassword" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:14px">
      <button id="loginBtn" class="primary grow" type="button">دخول</button>
      <button id="signupBtn" class="grow" type="button">إنشاء الحساب</button>
    </div>
    <div id="authMsg" class="msg muted"></div>
  </div>
</section>

<section id="appView" class="hide">
  <header class="top">
    <div class="topin">
      <div><b>غذائيات القدور ERP</b><div id="who" class="muted"></div></div>
      <button id="logoutBtn" type="button">خروج</button>
    </div>
  </header>
  <div class="shell">
    <div id="nav" class="nav"></div>
    <main id="main"></main>
  </div>
</section>
<div id="toast" class="toast"></div>

<script>
"use strict";

const SUPABASE_URL = "https://sirlzuuqnygrxxvipygx.supabase.co";
const SUPABASE_KEY = "sb_publishable_dvgfbh2SiWdg76EN5BawEw_scEcawBX";
const SESSION_KEY = "qudour_erp_session_v2";

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => Number(v ?? 0).toLocaleString("ar-EG",{maximumFractionDigits:4});
const today = () => new Date().toISOString().slice(0,10);
const showToast = (m,bad=false) => { const t=$("toast"); t.textContent=m; t.style.background=bad?"#9d2424":"#182033"; t.style.display="block"; setTimeout(()=>t.style.display="none",4500); };

function parseError(j,status){
  if(j && typeof j==="object") return j.message || j.msg || j.error_description || j.error || ("HTTP "+status);
  return String(j || ("HTTP "+status));
}
function readSession(){ try{return JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch{return null} }
function writeSession(s){ if(s)localStorage.setItem(SESSION_KEY,JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); }

async function rawFetch(path,{method="GET",body=null,headers={},auth=true,retry=true}={}){
  let s=readSession();
  if(auth && s?.expires_at && Date.now()/1000 > Number(s.expires_at)-60) s=await refreshSession();
  const h={apikey:SUPABASE_KEY,...headers};
  if(auth && s?.access_token) h.authorization="Bearer "+s.access_token;
  const r=await fetch(SUPABASE_URL+path,{method,headers:h,body:body==null?null:JSON.stringify(body)});
  if(r.status===401 && retry && auth && readSession()?.refresh_token){
    const n=await refreshSession();
    if(n) return rawFetch(path,{method,body,headers,auth,retry:false});
  }
  const text=await r.text();
  let data=null;
  if(text){try{data=JSON.parse(text)}catch{data=text}}
  if(!r.ok) throw new Error(parseError(data,r.status));
  return data;
}
async function refreshSession(){
  const s=readSession(); if(!s?.refresh_token)return null;
  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{
      method:"POST",headers:{apikey:SUPABASE_KEY,"content-type":"application/json"},
      body:JSON.stringify({refresh_token:s.refresh_token})
    });
    const j=await r.json().catch(()=>({}));
    if(!r.ok || !j.access_token){writeSession(null);return null}
    writeSession(j); return j;
  }catch{writeSession(null);return null}
}
async function signIn(email,password){
  const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
    method:"POST",headers:{apikey:SUPABASE_KEY,"content-type":"application/json"},
    body:JSON.stringify({email,password})
  });
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(parseError(j,r.status));
  writeSession(j); return j;
}
async function signUp(email,password){
  const r=await fetch(SUPABASE_URL+"/auth/v1/signup",{
    method:"POST",headers:{apikey:SUPABASE_KEY,"content-type":"application/json"},
    body:JSON.stringify({email,password})
  });
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(parseError(j,r.status));
  if(j.access_token) writeSession(j);
  return j;
}
async function signOut(){
  const s=readSession();
  if(s?.access_token){
    try{await fetch(SUPABASE_URL+"/auth/v1/logout",{method:"POST",headers:{apikey:SUPABASE_KEY,authorization:"Bearer "+s.access_token}})}catch{}
  }
  writeSession(null);
}
async function rpc(name,args={}){
  return rawFetch("/rest/v1/rpc/"+encodeURIComponent(name),{
    method:"POST",headers:{"content-type":"application/json"},body:args
  });
}
async function select(table,{select="*",filters=[],order=null,limit=null}={}){
  const u=new URL(SUPABASE_URL+"/rest/v1/"+encodeURIComponent(table));
  u.searchParams.set("select",select);
  for(const [col,op,val] of filters)u.searchParams.set(col,op+"."+String(val));
  if(order)u.searchParams.set("order",order);
  if(limit!=null)u.searchParams.set("limit",String(limit));
  return rawFetch(u.pathname+u.search,{method:"GET"});
}
async function insert(table,payload){
  return rawFetch("/rest/v1/"+encodeURIComponent(table),{
    method:"POST",headers:{"content-type":"application/json","prefer":"return=representation"},body:payload
  });
}

const S={profile:null,products:[],parties:[],accounts:[],stores:[],saleCart:[],purchaseCart:[],page:"dashboard"};

$("loginBtn").addEventListener("click", async ()=>{
  const email=$("authEmail").value.trim(), password=$("authPassword").value;
  $("authMsg").className="msg muted"; $("authMsg").textContent="جارٍ الدخول...";
  try{
    if(!email || !password) throw new Error("أدخل البريد وكلمة المرور.");
    await signIn(email,password);
    await startApp();
  }catch(e){$("authMsg").className="msg error";$("authMsg").textContent=e.message}
});
$("signupBtn").addEventListener("click", async ()=>{
  const email=$("authEmail").value.trim(), password=$("authPassword").value;
  $("authMsg").className="msg muted"; $("authMsg").textContent="جارٍ إنشاء الحساب...";
  try{
    if(!email || password.length<6) throw new Error("أدخل بريدًا صحيحًا وكلمة مرور من 6 أحرف على الأقل.");
    const j=await signUp(email,password);
    if(j.access_token){ await startApp(); }
    else{$("authMsg").className="msg ok";$("authMsg").textContent="تم إنشاء الحساب. افتح رسالة تأكيد البريد إن وصلت، ثم ارجع وسجّل الدخول."}
  }catch(e){$("authMsg").className="msg error";$("authMsg").textContent=e.message}
});
$("logoutBtn").addEventListener("click",async()=>{await signOut();location.reload()});

async function claimAndProfile(){
  try{await rpc("claim_employee_account",{})}catch(e){}
  const p=await rpc("my_profile",{});
  if(!Array.isArray(p) || !p.length) throw new Error("تم تسجيل الدخول، لكن الحساب غير مربوط بموظف داخل النظام.");
  return p[0];
}
async function loadBase(){
  const [pr,pa,ac,st]=await Promise.all([
    select("v_product_current_prices",{filters:[["status","eq","active"]],order:"name.asc"}),
    select("parties",{select:"id,party_code,name,is_customer,is_supplier,status",filters:[["status","eq","active"]],order:"name.asc"}),
    select("financial_accounts",{select:"id,account_code,name,currency,account_type,is_active,opening_balance",filters:[["is_active","eq","true"]]}),
    select("stores",{select:"id,code,name,is_active",filters:[["is_active","eq","true"]]})
  ]);
  S.products=pr||[]; S.parties=pa||[]; S.accounts=ac||[]; S.stores=st||[];
}
function hasPerm(k){return !!S.profile?.permissions?.[k] || !!S.profile?.permissions?.admin || S.profile?.role==="owner" || S.profile?.role==="admin";}
function buildNav(){
  const items=S.profile?.role==="price_worker" ? [["prices","الأسعار"]] :
  [["dashboard","الرئيسية"],["sale","بيع سريع"],["purchase","شراء"],["payment","قبض / دفع"],["inventory","المخزون"],["prices","الأسعار"],["debts","الذمم"],["search","بحث"],["reports","التقارير"],["setup","تهيئة"]];
  $("nav").innerHTML=items.map(([k,l])=>`<button type="button" data-page="${k}">${l}</button>`).join("");
  $("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
}
async function startApp(){
  try{
    const s=readSession(); if(!s?.access_token) return;
    S.profile=await claimAndProfile();
    $("authView").classList.add("hide"); $("appView").classList.remove("hide");
    $("who").textContent=(S.profile.name||"")+(S.profile.role?" — "+S.profile.role:"");
    buildNav();
    if(S.profile.role==="price_worker"){await go("prices");return}
    await loadBase(); await go("dashboard");
  }catch(e){
    await signOut();
    $("authView").classList.remove("hide"); $("appView").classList.add("hide");
    $("authMsg").className="msg error"; $("authMsg").textContent=e.message;
  }
}
async function go(page){
  S.page=page;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  $("main").innerHTML='<div class="card">جارٍ التحميل...</div>';
  try{
    if(page==="dashboard")await renderDashboard();
    else if(page==="prices")await renderPrices();
    else if(page==="sale")renderDocument("sale");
    else if(page==="purchase")renderDocument("purchase");
    else if(page==="payment")await renderPayment();
    else if(page==="inventory")await renderInventory();
    else if(page==="debts")await renderDebts();
    else if(page==="search")renderSearch();
    else if(page==="reports")await renderReports();
    else if(page==="setup")await renderSetup();
  }catch(e){$("main").innerHTML=`<div class="card dangerbox"><b>خطأ</b><div>${esc(e.message)}</div></div>`}
}
async function renderDashboard(){
  let alerts=[]; try{alerts=await select("v_operational_alerts",{limit:40})}catch{}
  const critical=alerts.filter(x=>x.severity==="critical").length, warning=alerts.filter(x=>x.severity==="warning").length;
  $("main").innerHTML=`<div class="grid">
    <div class="card"><div class="muted">الأصناف النشطة</div><div class="kpi">${S.products.length}</div></div>
    <div class="card"><div class="muted">الأطراف</div><div class="kpi">${S.parties.length}</div></div>
    <div class="card"><div class="muted">تنبيهات حرجة</div><div class="kpi">${critical}</div></div>
    <div class="card"><div class="muted">تحذيرات</div><div class="kpi">${warning}</div></div>
  </div><div class="card"><div class="section">التنبيهات</div>${alerts.slice(0,20).map(x=>`<div style="padding:7px 0;border-bottom:1px solid #eee">${esc(x.message||"")}</div>`).join("")||'<div class="muted">لا توجد تنبيهات.</div>'}</div>`;
}
async function renderPrices(){
  if(!S.products.length && S.profile.role!=="price_worker") await loadBase();
  $("main").innerHTML=`<div class="card"><div class="section">بحث الأسعار</div><div class="row">
    <input id="priceQ" class="grow" placeholder="اسم الصنف أو الكود أو الباركود"><button id="priceSearch" class="primary" type="button">بحث</button>
  </div></div><div id="priceRes"></div>`+
  (S.profile.role==="price_worker"?"":`<div class="card"><div class="section">تسجيل سعر جديد</div><div class="grid">
    <select id="priceProd">${S.products.map(p=>`<option value="${esc(p.product_id)}">${esc(p.product_code+" — "+p.name)}</option>`).join("")}</select>
    <select id="priceType"><option value="sale">سعر بيع</option><option value="purchase_reference">سعر شراء مرجعي</option></select>
    <select id="priceCur"><option>SYP</option><option>USD</option></select><input id="priceAmt" type="number" step="any" min="0" placeholder="السعر">
  </div><button id="savePrice" class="primary" style="margin-top:10px" type="button">حفظ السعر</button></div>`);
  $("priceSearch").addEventListener("click",priceSearch);
  $("priceQ").addEventListener("keydown",e=>{if(e.key==="Enter")priceSearch()});
  if($("savePrice"))$("savePrice").addEventListener("click",savePrice);
  await priceSearch();
}
async function priceSearch(){
  const q=$("priceQ").value.trim(); let data=[];
  if(S.profile.role==="price_worker") data=await rpc("price_lookup",{p_query:q,p_limit:100});
  else data=S.products.filter(p=>!q||String(p.name||"").includes(q)||String(p.product_code||"").includes(q)||String(p.barcode||"").includes(q)).slice(0,100);
  $("priceRes").innerHTML=`<div class="card tablewrap"><table class="tbl"><thead><tr><th>الكود</th><th>الصنف</th><th>سعر البيع</th><th>العملة</th></tr></thead><tbody>
  ${data.map(p=>`<tr><td>${esc(p.product_code)}</td><td>${esc(p.name)}</td><td>${num(p.sale_price)}</td><td>${esc(p.sale_currency||"")}</td></tr>`).join("")}</tbody></table></div>`;
}
async function savePrice(){
  const amount=Number($("priceAmt").value); if(!(amount>=0))return showToast("أدخل سعرًا صحيحًا",true);
  try{await insert("product_price_history",{product_id:$("priceProd").value,price_type:$("priceType").value,currency:$("priceCur").value,amount,source_type:"qudour_erp_app",notes:"إدخال من واجهة ERP"});showToast("تم حفظ السعر");await loadBase();await renderPrices()}catch(e){showToast(e.message,true)}
}
function partyOptions(kind){
  return S.parties.filter(p=>kind==="customer"?p.is_customer:p.is_supplier).map(p=>`<option value="${p.id}">${esc(p.party_code+" — "+p.name)}</option>`).join("");
}
function productOptions(){return S.products.map(p=>`<option value="${p.product_id}">${esc(p.product_code+" — "+p.name)}</option>`).join("")}
function renderDocument(kind){
  const sale=kind==="sale";
  if(!hasPerm(sale?"sales":"purchases")){$("main").innerHTML='<div class="card dangerbox">لا توجد صلاحية.</div>';return}
  const cart=sale?S.saleCart:S.purchaseCart;
  $("main").innerHTML=`<div class="card"><div class="section">${sale?"فاتورة بيع":"فاتورة شراء"}</div><div class="grid">
    <select id="docParty">${partyOptions(sale?"customer":"supplier")}</select>
    <select id="docCur"><option>SYP</option><option>USD</option></select>
    <input id="docDate" type="date" value="${today()}">
    ${sale?"":'<input id="supplierNo" placeholder="رقم فاتورة المورد">'}
  </div></div>
  <div class="card"><div class="row"><select id="docProd" class="grow">${productOptions()}</select><button id="addProd" type="button">إضافة</button></div>
  <div id="cart"></div><div style="text-align:left;margin-top:10px"><b>الإجمالي: <span id="docTotal">0</span></b></div></div>
  <div class="card"><div class="section">التسديد</div><select id="settle"><option value="credit">آجل / بدون دفعة</option><option value="cash">نقدي كامل</option></select>
  <textarea id="docNotes" placeholder="ملاحظات"></textarea><button id="postDoc" class="primary" style="margin-top:10px" type="button">ترحيل الفاتورة</button></div>`;
  const refresh=()=>{
    $("cart").innerHTML=cart.length?cart.map((x,i)=>`<div class="line"><div class="wide"><b>${esc(x.name)}</b><div class="muted">${esc(x.code)}</div></div>
    <input data-q="${i}" type="number" step="any" min="0.0001" value="${x.quantity}"><input data-p="${i}" type="number" step="any" min="0" value="${x.unit_price}">
    <button data-del="${i}" type="button">حذف</button></div>`).join(""):'<div class="muted">لم تضف أصنافًا بعد.</div>';
    $("docTotal").textContent=num(cart.reduce((a,b)=>a+b.quantity*b.unit_price,0));
    $("cart").querySelectorAll("[data-q]").forEach(el=>el.addEventListener("change",()=>{cart[Number(el.dataset.q)].quantity=Number(el.value);refresh()}));
    $("cart").querySelectorAll("[data-p]").forEach(el=>el.addEventListener("change",()=>{cart[Number(el.dataset.p)].unit_price=Number(el.value);refresh()}));
    $("cart").querySelectorAll("[data-del]").forEach(el=>el.addEventListener("click",()=>{cart.splice(Number(el.dataset.del),1);refresh()}));
  };
  $("addProd").addEventListener("click",()=>{const p=S.products.find(x=>x.product_id===$("docProd").value);if(!p)return;const ex=cart.find(x=>x.product_id===p.product_id);if(ex)ex.quantity+=1;else cart.push({product_id:p.product_id,name:p.name,code:p.product_code,quantity:1,unit_price:Number(sale?p.sale_price:p.purchase_reference)||0});refresh()});
  $("postDoc").addEventListener("click",async()=>{
    if(!cart.length)return showToast("أضف صنفًا واحدًا على الأقل",true);
    const total=cart.reduce((a,b)=>a+b.quantity*b.unit_price,0);
    if(!confirm("سيتم ترحيل الفاتورة وتثبيت أثرها. متابعة؟"))return;
    const common={p_party_id:$("docParty").value,p_store_id:null,p_currency:$("docCur").value,p_invoice_date:$("docDate").value,p_lines:cart.map(x=>({product_id:x.product_id,quantity:x.quantity,unit_price:x.unit_price})),p_settlements:$("settle").value==="cash"?[{amount:total,method:"cash"}]:[],p_document_type:"invoice",p_original_invoice_id:null,p_due_date:null,p_notes:$("docNotes").value||null};
    try{
      const data=sale?await rpc("create_sales_transaction",{...common,p_external_ref:null}):await rpc("create_purchase_transaction",{...common,p_supplier_invoice_no:$("supplierNo").value||null});
      showToast("تم ترحيل "+(data?.invoice_no||"الفاتورة")); cart.splice(0,cart.length); await loadBase(); renderDocument(kind);
    }catch(e){showToast(e.message,true)}
  });
  refresh();
}
async function renderPayment(){
  if(!hasPerm("payments"))throw new Error("لا توجد صلاحية قبض/دفع.");
  $("main").innerHTML=`<div class="card"><div class="section">قبض / دفع</div><div class="grid">
    <select id="payType"><option value="receivable">عميل</option><option value="payable">مورد</option></select>
    <select id="payDir"><option value="receipt">قبض</option><option value="payment">دفع</option></select>
    <select id="payParty"></select><select id="payCur"><option>SYP</option><option>USD</option></select>
    <input id="payAmount" type="number" min="0" step="any" placeholder="المبلغ">
    <select id="payMethod"><option value="cash">نقدي</option><option value="bank_transfer">حوالة</option><option value="check">شيك</option><option value="other">أخرى</option></select>
    <input id="payRef" placeholder="رقم مرجع/شيك"><input id="payDate" type="date" value="${today()}">
  </div><textarea id="payNotes" placeholder="ملاحظات"></textarea><button id="postPay" class="primary" style="margin-top:10px" type="button">ترحيل السند</button></div>`;
  const refill=()=>{$("payParty").innerHTML=partyOptions($("payType").value==="receivable"?"customer":"supplier")}; refill();
  $("payType").addEventListener("change",refill);
  $("postPay").addEventListener("click",async()=>{
    const amount=Number($("payAmount").value);if(!(amount>0))return showToast("أدخل مبلغًا صحيحًا",true);
    if(!confirm("سيتم ترحيل السند وتحديث الذمة. متابعة؟"))return;
    try{
      const d=await rpc("create_payment_transaction",{p_party_id:$("payParty").value,p_direction:$("payDir").value,p_settlement_account_type:$("payType").value,p_currency:$("payCur").value,p_amount:amount,p_method:$("payMethod").value,p_financial_account_id:null,p_payment_date:$("payDate").value,p_reference_no:$("payRef").value||null,p_check_status:$("payMethod").value==="check"?"pending":null,p_allocation_document_id:null,p_notes:$("payNotes").value||null});
      showToast("تم ترحيل "+(d?.payment_no||"السند")); await renderPayment();
    }catch(e){showToast(e.message,true)}
  });
}
async function renderInventory(){
  if(!hasPerm("inventory"))throw new Error("لا توجد صلاحية مخزون.");
  const data=await select("v_stock_balance",{select:"product_id,quantity,avg_cost_base,inventory_value_base"});
  const m=new Map((data||[]).map(x=>[x.product_id,x]));
  $("main").innerHTML=`<div class="card"><div class="section">المخزون الحالي</div><div class="tablewrap"><table class="tbl"><thead><tr><th>الكود</th><th>الصنف</th><th>الكمية</th><th>متوسط التكلفة</th></tr></thead><tbody>
  ${S.products.map(p=>{const x=m.get(p.product_id)||{};return `<tr><td>${esc(p.product_code)}</td><td>${esc(p.name)}</td><td>${num(x.quantity)}</td><td>${num(x.avg_cost_base)}</td></tr>`}).join("")}
  </tbody></table></div></div><div class="card warnbox"><b>الجرد الافتتاحي</b><p>لا يتم اعتماد المخزون إلا عبر جرد فعلي. تم إبقاء المخزون القديم خارج التشغيل عمدًا.</p></div>`;
}
async function renderDebts(){
  const [b,p]=await Promise.all([select("v_party_balances",{order:"currency.asc"}),select("parties",{select:"id,party_code,name"})]);
  const pm=new Map((p||[]).map(x=>[x.id,x]));
  $("main").innerHTML=`<div class="card"><div class="section">الذمم</div><div class="tablewrap"><table class="tbl"><thead><tr><th>الطرف</th><th>الحساب</th><th>العملة</th><th>الرصيد</th></tr></thead><tbody>
  ${(b||[]).map(x=>`<tr><td>${esc((pm.get(x.party_id)?.party_code||"")+" — "+(pm.get(x.party_id)?.name||""))}</td><td>${esc(x.account_type)}</td><td>${esc(x.currency)}</td><td class="money">${num(x.balance)}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}
function renderSearch(){
  $("main").innerHTML=`<div class="card"><div class="section">بحث شامل</div><div class="row"><input id="searchQ" class="grow" placeholder="صنف، طرف، فاتورة، سند، كود أو باركود"><button id="doSearch" class="primary" type="button">بحث</button></div></div><div id="searchRes"></div>`;
  const run=async()=>{try{const d=await rpc("search_erp",{p_query:$("searchQ").value,p_limit:100});$("searchRes").innerHTML=`<div class="card tablewrap"><table class="tbl"><thead><tr><th>النوع</th><th>العنوان</th><th>التفاصيل</th><th>المبلغ</th></tr></thead><tbody>${(d||[]).map(x=>`<tr><td>${esc(x.result_type)}</td><td>${esc(x.title)}</td><td>${esc(x.subtitle||"")}</td><td>${num(x.amount)} ${esc(x.currency||"")}</td></tr>`).join("")}</tbody></table></div>`}catch(e){showToast(e.message,true)}};
  $("doSearch").addEventListener("click",run);$("searchQ").addEventListener("keydown",e=>{if(e.key==="Enter")run()});
}
async function renderReports(){
  const [cash,so,po]=await Promise.all([
    select("v_cash_balances",{}).catch(()=>[]),
    select("v_sales_outstanding",{filters:[["outstanding","gt","0"]]}).catch(()=>[]),
    select("v_purchase_outstanding",{filters:[["outstanding","gt","0"]]}).catch(()=>[])
  ]);
  $("main").innerHTML=`<div class="grid">${(cash||[]).map(x=>`<div class="card"><div class="muted">${esc(x.name+" "+x.currency)}</div><div class="kpi">${num(x.balance)}</div></div>`).join("")}</div>
  <div class="grid"><div class="card"><div class="section">فواتير العملاء غير المسددة</div>${(so||[]).map(x=>`<div>${esc(x.invoice_no||"")} — ${num(x.outstanding)} ${esc(x.currency)}</div>`).join("")||'<span class="muted">لا يوجد</span>'}</div>
  <div class="card"><div class="section">فواتير الموردين غير المسددة</div>${(po||[]).map(x=>`<div>${esc(x.invoice_no||"")} — ${num(x.outstanding)} ${esc(x.currency)}</div>`).join("")||'<span class="muted">لا يوجد</span>'}</div></div>`;
}
async function renderSetup(){
  const st=await select("system_settings",{select:"key,value"}).catch(()=>[]);
  const sm=Object.fromEntries((st||[]).map(x=>[x.key,x.value]));
  $("main").innerHTML=`<div class="card"><div class="section">حالة الجاهزية</div>
  ${["fx_confirmed","cash_opening_confirmed","party_opening_confirmed","physical_stock_confirmed"].map(k=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${esc(k)}</span><span class="pill">${sm[k]===true?"مؤكد":"غير مؤكد"}</span></div>`).join("")}</div>
  <div class="card"><div class="section">سعر الصرف</div><input id="fxRate" type="number" step="any" min="0" placeholder="1 USD = ؟ SYP"><button id="confirmFx" class="primary" style="margin-top:8px" type="button">اعتماد سعر الصرف</button></div>
  <div class="card"><div class="section">رصيد الصندوق الافتتاحي</div><div class="grid"><input id="cashSyp" type="number" min="0" step="any" placeholder="SYP"><input id="cashUsd" type="number" min="0" step="any" placeholder="USD"></div><button id="confirmCash" class="primary" style="margin-top:8px" type="button">اعتماد الرصيد</button></div>`;
  $("confirmFx").addEventListener("click",async()=>{const r=Number($("fxRate").value);if(!(r>0))return showToast("أدخل سعرًا صحيحًا",true);if(!confirm("اعتماد سعر الصرف؟"))return;try{await rpc("confirm_exchange_rate",{p_rate:r,p_rate_date:today()});showToast("تم الاعتماد");await renderSetup()}catch(e){showToast(e.message,true)}});
  $("confirmCash").addEventListener("click",async()=>{const s=Number($("cashSyp").value||0),u=Number($("cashUsd").value||0);if(!confirm("اعتماد أرصدة الصندوق؟"))return;try{await rpc("confirm_opening_cash",{p_syp:s,p_usd:u});showToast("تم الاعتماد");await renderSetup()}catch(e){showToast(e.message,true)}});
}

window.addEventListener("error",e=>{console.error(e.error||e.message); if(!$("authView").classList.contains("hide")){$("authMsg").className="msg error";$("authMsg").textContent="خطأ تقني: "+e.message}});
window.addEventListener("unhandledrejection",e=>{console.error(e.reason); if(!$("authView").classList.contains("hide")){$("authMsg").className="msg error";$("authMsg").textContent="خطأ تقني: "+(e.reason?.message||String(e.reason))}});

(async()=>{if(readSession()?.access_token)await startApp()})();
</script>
</body>
